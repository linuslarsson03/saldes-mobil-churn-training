name: CI

on:
  push:
    paths:
      - "src/**"
      - "data/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"      

  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "data/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"

  schedule:
  - cron: "0 6 * * 1"
    timezone: "Europe/Stockholm"

  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        versions: ["3.11", "3.12", "3.13"]
      fail-fast: false

    uses: ./.github/workflows/setup.yml
    with:
      python-version: ${{ matrix.versions }}
      command: "uv run --extra dev pytest"
      job-type: test

  training:
    needs: test
    uses: ./.github/workflows/setup.yml
    with:
      python-version: "3.11"
      command: "uv run python -m churn.model"
      job-type: training

  evaluate:
    needs: training
    uses: ./.github/workflows/setup.yml
    with:
      python-version: "3.11"
      command: "uv run python -m churn.evaluate"
      job-type: evaluate


  call-list:
    needs: evaluate
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/setup.yml
    with:
      python-version: "3.11"
      command: "uv run python -m churn.score"
      job-type: call-list