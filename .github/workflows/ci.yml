name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        versions: ["3.11", "3.12", "3.13"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{matrix.versions}}

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - run: uv sync --locked  --extra dev

      - run: uv run --extra dev pytest

       

  training:
    needs: test

    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v7

        - uses: actions/setup-python@v7
          with:
            python-version: "3.11"


        - uses: astral-sh/setup-uv@v6
          with:
            enable-cache: true
            cache-dependency-glob: |
              pyproject.toml
              uv.lock

        - run: uv sync --locked

        - run: uv run python -m churn.model

